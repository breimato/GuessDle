{% extends "base.html" %}
{% block title %}Nueva contraseña – GuessDle{% endblock %}

{% block main_class %}
min-h-screen flex items-center justify-center py-12 px-4
{% endblock %}

{% block content %}
<div class="cabinet-login">
  <div class="cabinet-panel">
    <h2 class="cabinet-panel__title">Nueva contraseña</h2>

    <form method="post">
      {% csrf_token %}
      <div class="cabinet-field">
        <label for="id_new_password1" class="cabinet-label">Nueva contraseña</label>
        <input type="password" name="new_password1" id="id_new_password1" required class="cabinet-input">
      </div>
      <div class="cabinet-field">
        <label for="id_new_password2" class="cabinet-label">Confirmar contraseña</label>
        <input type="password" name="new_password2" id="id_new_password2" required class="cabinet-input">
      </div>
      <button type="submit" class="cabinet-btn">Cambiar contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
