{% load static %}
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}GuessDle{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/arcade-theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.png' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  {% if user.is_authenticated %}
  <link rel="stylesheet" href="{% static 'css/challenge-toast.css' %}">
  {% endif %}
  {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% if background_url %}cabinet-page--game{% else %}cabinet-page{% endif %}{% endblock %}"
  {% if background_url %}style="background-image: url('{{ background_url }}');"{% endif %}>

  <main class="{% block main_class %}container mx-auto px-4 py-8{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <div class="h-24"></div>

  {% if user.is_authenticated %}
  <meta name="notifications-poll-url" content="{% url 'notifications_poll' %}">
  <meta name="notifications-ack-url" content="{% url 'notifications_ack' %}">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <audio id="global-bgm" preload="auto" playsinline hidden></audio>
  <script src="{% static 'js/global-bgm.js' %}" defer></script>
  <script src="{% static 'js/notifications.js' %}" defer></script>
  {% endif %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
